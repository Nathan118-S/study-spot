org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Study Spot app configuration -------------------------------------------
# Default server. Users can still change it in the app (long-press the logo on
# the welcome screen). Override per machine in local.properties.
studyspot.serverUrl=https://studyspot.education

# --- Optional Firebase Cloud Messaging (push) --------------------------------
# Leave empty to build without push. Put real values in local.properties
# (gitignored) rather than here. See README.md.
studyspot.fcm.projectId=
studyspot.fcm.appId=
studyspot.fcm.apiKey=
studyspot.fcm.senderId=
